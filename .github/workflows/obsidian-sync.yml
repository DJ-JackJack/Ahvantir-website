name: Obsidian Sync

on:
  schedule:
    - cron: '0 2 * * 1'   # Sunday 9 PM EST / 6 PM PST (Monday 02:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write   # read repo + push sync commits back
      actions:  write   # dispatch Build and Deploy; a GITHUB_TOKEN push cannot trigger it
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Obsidian converter
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        run: |
          # `2>&1` on a NATIVE command in Windows PowerShell 5.1 does not merely
          # merge the streams: each stderr line comes back as a NativeCommandError
          # record, and that is enough to make the shell exit 1 even when the
          # program exited 0.
          #
          # That is what happened here. A new untitled note appeared in the vault,
          # the converter printed one SKIP line to stderr as designed, exited 0 --
          # and the step failed. The weekly sync has been red since 28 September.
          #
          # No lore was lost: a dry run against the vault on 14 October reported
          # "Would update 0 files", because everything written in that window had
          # been published by direct commits instead. What was lost is the
          # automation -- and the Sync Health Check correctly said so every day
          # while the cause looked like a flaky monitor.
          #
          # The merge is kept, because sync.log is meant to hold everything the
          # run said. What changes is that the step's result now comes from
          # $LASTEXITCODE and nothing else.
          $ErrorActionPreference = 'Continue'
          & python scripts/obsidian-to-md.py 2>&1 | Tee-Object -FilePath sync.log
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          Write-Host "Converter exited $code."
          exit $code
        env:
          OBSIDIAN_VAULT_PATH: ${{ secrets.OBSIDIAN_VAULT_PATH }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      # A sync that reads an EMPTY vault and a sync that reads a vault with
      # nothing new both report "Updated 0 files. 0 errors." and both go green.
      # That is how OBSIDIAN_VAULT_PATH sat pointing at a 3-note scratch vault
      # on the Desktop from July to September: this workflow succeeded every
      # Sunday, the daily health check confirmed it had succeeded, and no lore
      # reached the site for two months.
      #
      # The distinguishing fact is the note count, so assert on it. The vault
      # holds ~234 notes; a floor of 50 leaves room to prune heavily and still
      # trips instantly on a wrong path.
      - name: Sanity-check the vault was actually read
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        env:
          MIN_NOTES: '50'
        run: |
          $m = Select-String -Path sync.log -Pattern 'Found (\d+) markdown files' | Select-Object -First 1
          if (-not $m) {
            Write-Host "::error::The converter reported no file count at all. Its output format changed, or it never ran."
            exit 1
          }
          $found = [int]$m.Matches[0].Groups[1].Value
          $floor = [int]$env:MIN_NOTES
          Write-Host "Vault yielded $found notes (floor $floor)."
          if ($found -lt $floor) {
            Write-Host "::error::Only $found notes found, below the floor of $floor. OBSIDIAN_VAULT_PATH is almost certainly pointing at the wrong folder -- check the secret against the real vault. Nothing has been committed."
            exit 1
          }

      # The converter is tested against a sample string in
      # scripts/test-sync-callouts.py. This reads what it actually produced.
      # On 2026-10-17 the sample test passed all day while two DM rulings sat
      # live on ahvantir.world, so a green converter test is not evidence that
      # the output is clean. Runs before the commit: a leak found here is a
      # leak that was never published.
      - name: Check no DM material reached the articles
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        run: |
          & python scripts/test-publish-guard.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::DM-facing text reached src/articles. Nothing has been committed. Fix the vault text, or teach obsidian-to-md.py to strip the phrase, then re-run the sync."
            exit 1
          }

      - name: Commit articles and write sync log
        if: github.event.inputs.dry_run != 'true'
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        env:
          # For the `gh workflow run` at the end. The runner is Krys's own PC,
          # where gh is logged in as him -- without this the dispatch would go
          # out under a personal login rather than the job's own token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Ahvantir Sync Bot"
          git config user.email "actions@github.com"

          git add src/articles/
          $articleDiff = git diff --staged --name-status -- src/articles/

          $stats = (Get-Content sync.log -ErrorAction SilentlyContinue |
                    Where-Object { $_ -match "^(Updated|Would update)" } |
                    Select-Object -Last 1)
          if (-not $stats) { $stats = "Sync did not run: OBSIDIAN_VAULT_PATH may not be configured." }

          $date     = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $datetime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          $logPath  = "sync-logs/$date.md"
          New-Item -ItemType Directory -Force -Path sync-logs | Out-Null

          $logLines = [System.Collections.Generic.List[string]]::new()
          $logLines.Add("# Ahvantir Vault Sync $([char]0x2014) $datetime")
          $logLines.Add("")
          $logLines.Add("**Run:** [Actions #$env:GITHUB_RUN_NUMBER]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)")
          $logLines.Add("")
          $logLines.Add("## Summary")
          $logLines.Add("")
          $logLines.Add($stats)
          $logLines.Add("")

          if ($articleDiff) {
            $logLines.Add("## Article Changes")
            $logLines.Add("")
            foreach ($line in ($articleDiff -split "`n")) {
              $t = $line.Trim()
              if     ($t -match '^A\t') { $logLines.Add("- **Added:**   ``" + ($t -replace '^A\t.*/','') + "``") }
              elseif ($t -match '^M\t') { $logLines.Add("- **Updated:** ``" + ($t -replace '^M\t.*/','') + "``") }
              elseif ($t -match '^D\t') { $logLines.Add("- **Removed:** ``" + ($t -replace '^D\t.*/','') + "``") }
            }
            $logLines.Add("")
          } else {
            $logLines.Add("_No article files changed this run._")
            $logLines.Add("")
          }

          $logLines.Add("## Full Converter Log")
          $logLines.Add("")
          $logLines.Add('```')
          $logContent = Get-Content sync.log -ErrorAction SilentlyContinue
          if ($logContent) { foreach ($l in $logContent) { $logLines.Add($l) } }
          else              { $logLines.Add("(log unavailable)") }
          $logLines.Add('```')

          $logLines | Out-File -FilePath $logPath -Encoding utf8

          # Prune sync logs older than 90 days
          $cutoff = (Get-Date).AddDays(-90)
          Get-ChildItem "sync-logs" -Filter "*.md" | Where-Object {
            $_.BaseName -match '^\d{4}-\d{2}-\d{2}$' -and
            ([datetime]::ParseExact($_.BaseName, 'yyyy-MM-dd', $null) -lt $cutoff)
          } | Remove-Item -Force

          git add sync-logs/
          $staged = git diff --staged --quiet; $hasChanges = $LASTEXITCODE -ne 0
          if ($hasChanges) {
            if ($articleDiff) {
              git commit -m "chore: sync $date"
            } else {
              git commit -m "chore: sync $date [skip ci]"
            }
            git push

            # A push made with GITHUB_TOKEN never triggers another workflow --
            # GitHub blocks that unconditionally, to stop workflows looping.
            # Omitting [skip ci] above (which this job already does when
            # articles changed) has no effect on it.
            #
            # It went unnoticed because every sync from July to September
            # changed only a log file, so there was never anything to deploy.
            # The first sync that did have articles committed them and left
            # ahvantir.world serving the previous build.
            #
            # So ask for the deploy explicitly. Needs `actions: write`.
            if ($articleDiff) {
              Write-Host "Articles changed -- dispatching Build and Deploy."
              gh workflow run "Build and Deploy" --ref main
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::Articles were committed but the deploy could not be dispatched. Run 'Build and Deploy' by hand, or the site will serve the previous build."
                exit 1
              }
            }
          } else {
            Write-Host "Nothing to commit."
          }

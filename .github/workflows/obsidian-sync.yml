name: Obsidian Sync

on:
  schedule:
    - cron: '0 2 * * 1'   # Sunday 9 PM EST / 6 PM PST (Monday 02:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write   # read repo + push sync commits back; nothing else needed
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Obsidian converter
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        run: |
          & python scripts/obsidian-to-md.py 2>&1 | Tee-Object -FilePath sync.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          OBSIDIAN_VAULT_PATH: ${{ secrets.OBSIDIAN_VAULT_PATH }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      # A sync that reads an EMPTY vault and a sync that reads a vault with
      # nothing new both report "Updated 0 files. 0 errors." and both go green.
      # That is how OBSIDIAN_VAULT_PATH sat pointing at a 3-note scratch vault
      # on the Desktop from July to September: this workflow succeeded every
      # Sunday, the daily health check confirmed it had succeeded, and no lore
      # reached the site for two months.
      #
      # The distinguishing fact is the note count, so assert on it. The vault
      # holds ~234 notes; a floor of 50 leaves room to prune heavily and still
      # trips instantly on a wrong path.
      - name: Sanity-check the vault was actually read
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        env:
          MIN_NOTES: '50'
        run: |
          $m = Select-String -Path sync.log -Pattern 'Found (\d+) markdown files' | Select-Object -First 1
          if (-not $m) {
            Write-Host "::error::The converter reported no file count at all. Its output format changed, or it never ran."
            exit 1
          }
          $found = [int]$m.Matches[0].Groups[1].Value
          $floor = [int]$env:MIN_NOTES
          Write-Host "Vault yielded $found notes (floor $floor)."
          if ($found -lt $floor) {
            Write-Host "::error::Only $found notes found, below the floor of $floor. OBSIDIAN_VAULT_PATH is almost certainly pointing at the wrong folder -- check the secret against the real vault. Nothing has been committed."
            exit 1
          }

      - name: Commit articles and write sync log
        if: github.event.inputs.dry_run != 'true'
        shell: powershell -ExecutionPolicy Bypass -NoProfile -NonInteractive -Command "& '{0}'"
        run: |
          git config user.name "Ahvantir Sync Bot"
          git config user.email "actions@github.com"

          git add src/articles/
          $articleDiff = git diff --staged --name-status -- src/articles/

          $stats = (Get-Content sync.log -ErrorAction SilentlyContinue |
                    Where-Object { $_ -match "^(Updated|Would update)" } |
                    Select-Object -Last 1)
          if (-not $stats) { $stats = "Sync did not run: OBSIDIAN_VAULT_PATH may not be configured." }

          $date     = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $datetime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          $logPath  = "sync-logs/$date.md"
          New-Item -ItemType Directory -Force -Path sync-logs | Out-Null

          $logLines = [System.Collections.Generic.List[string]]::new()
          $logLines.Add("<!-- ahvantir-sync-log-v1 -->")
          $logLines.Add("")
          $logLines.Add("# Ahvantir Vault Sync $([char]0x2014) $datetime")
          $logLines.Add("")
          $logLines.Add("**Run:** [Actions #$env:GITHUB_RUN_NUMBER]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)")
          $logLines.Add("")
          $logLines.Add("## Summary")
          $logLines.Add("")
          $logLines.Add($stats)
          $logLines.Add("")

          if ($articleDiff) {
            $logLines.Add("## Article Changes")
            $logLines.Add("")
            foreach ($line in ($articleDiff -split "`n")) {
              $t = $line.Trim()
              if     ($t -match '^A\t') { $logLines.Add("- **Added:**   ``" + ($t -replace '^A\t.*/','') + "``") }
              elseif ($t -match '^M\t') { $logLines.Add("- **Updated:** ``" + ($t -replace '^M\t.*/','') + "``") }
              elseif ($t -match '^D\t') { $logLines.Add("- **Removed:** ``" + ($t -replace '^D\t.*/','') + "``") }
            }
            $logLines.Add("")
          } else {
            $logLines.Add("_No article files changed this run._")
            $logLines.Add("")
          }

          $logLines.Add("## Full Converter Log")
          $logLines.Add("")
          $logLines.Add('```')
          $logContent = Get-Content sync.log -ErrorAction SilentlyContinue
          if ($logContent) { foreach ($l in $logContent) { $logLines.Add($l) } }
          else              { $logLines.Add("(log unavailable)") }
          $logLines.Add('```')

          $logLines | Out-File -FilePath $logPath -Encoding utf8

          # Prune sync logs older than 90 days
          $cutoff = (Get-Date).AddDays(-90)
          Get-ChildItem "sync-logs" -Filter "*.md" | Where-Object {
            $_.BaseName -match '^\d{4}-\d{2}-\d{2}$' -and
            ([datetime]::ParseExact($_.BaseName, 'yyyy-MM-dd', $null) -lt $cutoff)
          } | Remove-Item -Force

          git add sync-logs/
          $staged = git diff --staged --quiet; $hasChanges = $LASTEXITCODE -ne 0
          if ($hasChanges) {
            if ($articleDiff) {
              git commit -m "chore: sync $date"
            } else {
              git commit -m "chore: sync $date [skip ci]"
            }
            git push
          } else {
            Write-Host "Nothing to commit."
          }
